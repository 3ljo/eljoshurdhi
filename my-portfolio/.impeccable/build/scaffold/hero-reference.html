<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Scaffold reference: comp-3-spread.png</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mulish:wght@700&family=BBH+Bogle:wght@400&family=Estedad:wght@700&family=Bebas+Neue:wght@400&display=swap">
  <link rel="stylesheet" href="layout.css">
  <style>html,body{margin:0}body{background:#0d0d0d}.region{box-sizing:border-box}.region.text p{white-space:pre-wrap}</style>
</head>
<body>
<!-- Reference only. Every region sits at its measured box inside a comp-aspect frame. Take the boxes (layout.css), keep your own semantic structure. -->
<main class="comp-frame" style="max-width:2688px">
  <div class="r-page-ground region chrome" data-region="page-ground"><!-- white newsprint ground above the spread carrying the running head --></div>
  <div class="r-running-head region text" data-region="running-head"><!-- running head 'ELJO · ISSUE 01 · TIRANA' in small bold caps --><p style="font-size:var(--r-running-head-font);font-family:var(--r-running-head-family),sans-serif;font-weight:var(--r-running-head-weight);line-height:1.05;margin:0">running-head</p></div>
  <div class="r-nav region control" data-region="nav"><!-- navigation links Work, How it works, Pricing, Why me: match the control's lettering and visible shape to the crop (comp-spec.mjs --crop nav); a control need not have button chrome --></div>
  <div class="r-nav-cta region control" data-region="nav-cta"><!-- black pill button 'Start My Project': match the control's lettering and visible shape to the crop (comp-spec.mjs --crop nav-cta); a control need not have button chrome --></div>
  <figure class="r-portrait region plate" data-region="portrait"><img src="../../../assets/plates/portrait.png" alt="" style="width:100%;height:100%;object-fit:contain;object-position:top left"></figure>
  <div class="r-masthead region text" data-region="masthead"><!-- vertical masthead 'ELJO' in signal-red ultra-heavy condensed capitals reading bottom to top --><p style="line-height:1.05;margin:0">masthead</p></div>
  <div class="r-gutter region chrome" data-region="gutter"><!-- centre fold: soft shadow where the two pages meet --></div>
  <div class="r-yellow-page region chrome" data-region="yellow-page"><!-- right page: flat acid-yellow field --></div>
  <div class="r-headline-1 region text" data-region="headline-1"><!-- headline line 'STOP LOSING' in ultra-heavy condensed black capitals --><p style="line-height:1.05;margin:0">headline-1</p></div>
  <div class="r-headline-2 region text" data-region="headline-2"><!-- headline line 'CUSTOMERS TO' in ultra-heavy condensed black capitals --><p style="font-size:var(--r-headline-2-font);font-family:var(--r-headline-2-family),sans-serif;font-weight:var(--r-headline-2-weight);line-height:1.05;margin:0">headline-2</p></div>
  <div class="r-headline-3 region text" data-region="headline-3"><!-- headline line 'BUSINESSES WITH' in ultra-heavy condensed black capitals --><p style="line-height:1.05;margin:0">headline-3</p></div>
  <div class="r-headline-4 region text" data-region="headline-4"><!-- headline line 'BETTER WEBSITES.' in ultra-heavy condensed black capitals --><p style="line-height:1.05;margin:0">headline-4</p></div>
  <div class="r-promise-1-num region text" data-region="promise-1-num"><!-- big condensed numeral 1 --><p style="font-size:var(--r-promise-1-num-font);line-height:1.05;margin:0">promise-1-num</p></div>
  <div class="r-promise-1-text region text" data-region="promise-1-text"><!-- 'Fixed price, in writing, before we start' bold sans, two lines --><p style="font-size:var(--r-promise-1-text-font);line-height:1.05;margin:0">promise-1-text</p></div>
  <div class="r-promise-2-num region text" data-region="promise-2-num"><!-- big condensed numeral 2 --><p style="line-height:1.05;margin:0">promise-2-num</p></div>
  <div class="r-promise-2-text region text" data-region="promise-2-text"><!-- 'A direct line to the person building it' bold sans, two lines --><p style="font-size:var(--r-promise-2-text-font);font-family:var(--r-promise-2-text-family),sans-serif;font-weight:var(--r-promise-2-text-weight);line-height:1.05;margin:0">promise-2-text</p></div>
  <div class="r-promise-3-num region text" data-region="promise-3-num"><!-- big condensed numeral 3 --><p style="line-height:1.05;margin:0">promise-3-num</p></div>
  <div class="r-promise-3-text region text" data-region="promise-3-text"><!-- 'Live in weeks, not months' bold sans, one line --><p style="font-size:var(--r-promise-3-text-font);line-height:1.05;margin:0">promise-3-text</p></div>
  <div class="r-cta-primary region control" data-region="cta-primary"><!-- large black pill button 'Start My Project →' with white text: match the control's lettering and visible shape to the crop (comp-spec.mjs --crop cta-primary); a control need not have button chrome --></div>
  <div class="r-cta-secondary region control" data-region="cta-secondary"><!-- underlined text link 'See the work': match the control's lettering and visible shape to the crop (comp-spec.mjs --crop cta-secondary); a control need not have button chrome --></div>
  <div class="r-folio region text" data-region="folio"><!-- page folio '02' --><p style="line-height:1.05;margin:0">folio</p></div>
  <div class="r-section-ground region chrome" data-region="section-ground"><!-- white band below the spread where the next section starts --></div>
  <div class="r-cover-stories-heading region text" data-region="cover-stories-heading"><!-- section heading 'COVER STORIES' in ultra-heavy condensed black capitals --><p style="font-size:var(--r-cover-stories-heading-font);font-family:var(--r-cover-stories-heading-family),sans-serif;font-weight:var(--r-cover-stories-heading-weight);line-height:1.05;margin:0">cover-stories-heading</p></div>
  <figure class="r-story-1-image region plate" data-region="story-1-image"><img src="../../../assets/plates/story-1-image.png" alt="" style="width:100%;height:100%;object-fit:contain;object-position:center"></figure>
  <div class="r-story-1-title region text" data-region="story-1-title"><!-- white condensed cover-story title set in type on top of the card --><p style="font-size:var(--r-story-1-title-font);line-height:1.05;margin:0">story-1-title</p></div>
  <figure class="r-story-2-image region plate" data-region="story-2-image"><img src="../../../assets/plates/story-2-image.png" alt="" style="width:100%;height:100%;object-fit:contain;object-position:center"></figure>
  <div class="r-story-2-title region text" data-region="story-2-title"><!-- white condensed cover-story title set in type on top of the card --><p style="font-size:var(--r-story-2-title-font);line-height:1.05;margin:0">story-2-title</p></div>
</main>
</body>
</html>
